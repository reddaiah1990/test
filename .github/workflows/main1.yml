name: Sample automation

on:
  workflow_dispatch:    
    inputs:
      tagname:
        type: string
        description: "Tagnames"
      envName:
        type: choice
        description: "Environment Name"
        options:
          - QA1
          - QA2
          - CHSQA1
          - CHSQA2
          - SOMAQA1
          - SOMAQA2
          - scratchOrg
jobs:
  map-envs:
    #runs-on: ubuntu-latest
    runs-on: terraform
    steps:
      - id: map-folder
        run: |
          echo "folder-path=Salesforce_Project" >> $GITHUB_OUTPUT
    
    outputs:
      folder-path: ${{ steps.map-folder.outputs.folder-path }}
  
