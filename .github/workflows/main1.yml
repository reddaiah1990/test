name: Sample automation

on:
  workflow_dispatch:
    inputs:
      envname: 
          type: choice
          description: Environment
          options:
  - QA1
  - QA2
  - CHSQA1
  - SOMAQA1
  - CHSQA2
  - SOMAQA2
  - scratchOrg
       tagname: 
         required: true
         type: string
jobs:
  map-envs:
    #runs-on: ubuntu-latest
    runs-on: terraform
    steps:
      - name: Run Maven tests
      id: testing
      run: mvn -f pom.xml clean test  -Dcucumber.filter.tags=${{inputs.tagname }} -DEnv=${{inputs.envname}}
